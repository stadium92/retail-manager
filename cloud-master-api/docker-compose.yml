version: '3.8'

services:
  # 1. The Cloud Database (PostgreSQL)
  cloud-db:
    image: postgres:15-alpine
    container_name: retail-manager-cloud-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: master_cloud
    ports:
      - "5432:5432"
    volumes:
      - cloud_db_data:/var/lib/postgresql/data

  # 2. The Rust Master API (We will run this locally for now for easier debugging)
  # But we define it here so you see the structure.
  # master-api:
  #   build: .
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - cloud-db

volumes:
  cloud_db_data:
