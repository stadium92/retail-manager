name: "CI/CD Pipeline: Build Windows Application"

on:
  push:
    branches:
      - main
      - frontend-test-1
      - main-niamana-dubai
  pull_request:
    branches:
      - main
      - frontend-test-1
      - main-niamana-dubai
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js v18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Root Dependencies
        run: npm install

      - name: Build Backend (local-bridge)
        working-directory: backend/local-bridge
        run: |
          npm install
          npm run build

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Prepare Sidecar Payload
        run: powershell -ExecutionPolicy Bypass -File scripts/prepare-sidecar-payload.ps1

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "Automated release by CI/CD Pipeline."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Publish installer to stadium94/app-releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.STADIUM94_RELEASE_TOKEN }}
        run: |
          $files = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle" -Recurse -Include *.msi,*.exe
          if ($files.Count -eq 0) {
            Write-Error "No installer files found under src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
            exit 1
          }
          $tag = "${{ github.ref_name }}-${{ github.run_number }}"
          gh release create $tag $($files.FullName) --repo stadium94/app-releases --title "${{ github.ref_name }} build ${{ github.run_number }}" --notes "Automated build from stadium93/retail-manager @ ${{ github.sha }}"



