name: "CI/CD Pipeline: Build Windows Application"

on:
  push:
    branches:
      - main
      - main-cloud-build
  pull_request:
    branches:
      - main
      - main-cloud-build
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js v18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Root Dependencies
        run: npm install

      - name: Build Backend (local-bridge)
        working-directory: backend/local-bridge
        run: |
          npm install
          npm run build

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Prepare Sidecar Payload
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/prepare-sidecar-payload.ps1
          # Align payload path for Tauri
          Copy-Item "backend/sidecar-wrapper/payload-x86_64-pc-windows-msvc.zip" -Destination "backend/local-bridge/payload.zip" -Force

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ env.APP_VERSION }}
          releaseName: "App v${{ env.APP_VERSION }}"
          releaseBody: "Automated release by CI/CD Pipeline."
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
