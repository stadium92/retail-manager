name: "CI/CD Pipeline: Build Windows Application"

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        shell: pwsh
        # tauri.conf.json's version was a static number nobody bumped, so
        # every build published the same filename to stadium94/app-releases
        # and silently overwrote the previous one. Auto-increment the patch
        # component here, before the build steps, so the version baked into
        # the app AND the published filename are both unique per build.
        run: |
          $confPath = "src-tauri/tauri.conf.json"
          $content = Get-Content $confPath -Raw
          if ($content -notmatch '"version":\s*"(\d+)\.(\d+)\.(\d+)"') {
            Write-Error "Could not find a version field in $confPath"
            exit 1
          }
          $newPatch = [int]$matches[3] + 1
          $newVersion = "$($matches[1]).$($matches[2]).$newPatch"
          $newContent = $content -replace '"version":\s*"\d+\.\d+\.\d+"', "`"version`": `"$newVersion`""
          Set-Content -Path $confPath -Value $newContent -NoNewline
          Write-Host "Bumped version to $newVersion"

          git config user.email "ci@retail-manager.local"
          git config user.name "retail-manager CI"
          git add $confPath
          git commit -q -m "chore: bump version to $newVersion"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Setup Node.js v18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Root Dependencies
        run: npm install

      - name: Build Backend (local-bridge)
        working-directory: backend/local-bridge
        run: |
          npm install
          npm run build

      - name: Build Frontend
        working-directory: frontend
        # Vite inlines VITE_* at build time - without these the client falls
        # back to FALLBACK_SUPABASE_URL in src/lib/supabase.ts
        # (onsqvduklnwffugsiybs, the shared stores project), while
        # local-bridge's own default (env.ts) targets fpvrbxmbrotowdlyebqv
        # (this product's own dedicated project) - a real project mismatch
        # that makes login fail for any account that only exists in the
        # project local-bridge actually syncs to. Values are the client-safe
        # publishable key, not a secret.
        env:
          VITE_SUPABASE_URL: https://fpvrbxmbrotowdlyebqv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3GUAh6Utm-V9SNLOTBOsxw_XQaNT1d2
        run: |
          npm install
          npm run build

      - name: Prepare Sidecar Payload
        env:
          SUPABASE_SERVICE_KEY_BUILD: ${{ secrets.STIHL_SUPABASE_SERVICE_KEY }}
        run: powershell -ExecutionPolicy Bypass -File scripts/prepare-sidecar-payload.ps1

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No tagName/release* fields on purpose: the actual distribution
          # point for this app is stadium94/app-releases, published by the
          # dedicated step below via STADIUM94_RELEASE_TOKEN. Without a
          # tagName, tauri-action just builds the bundle and stops - it
          # doesn't try to create a GitHub release on this (source) repo,
          # which the default GITHUB_TOKEN doesn't have permission for
          # anyway.
          args: --target x86_64-pc-windows-msvc

      - name: Publish installer to stadium94/app-releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.STADIUM94_RELEASE_TOKEN }}
        run: |
          $files = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle" -Recurse -Include *.msi,*.exe
          if ($files.Count -eq 0) {
            Write-Error "No installer files found under src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
            exit 1
          }

          # Plain branch push, not a GitHub Release/tag - GitHub auto-attaches
          # a "Source code (zip/tar.gz)" download to every Release AND every
          # tag, with no way to turn it off. A bare branch with no tag
          # triggers neither, so this is the only way to publish an installer
          # here without that link appearing next to it. One branch per
          # product, force-pushed fresh each build (no history to accumulate,
          # always just the latest build) - filenames include the semantic
          # version (from tauri.conf.json) so it's visible at a glance which
          # build is current without opening the file.
          $branch = "${{ github.ref_name }}"
          $publishDir = "publish-releases-repo"
          New-Item -ItemType Directory -Path $publishDir | Out-Null

          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = $files | Where-Object { $_.Extension -eq ".exe" } | Select-Object -First 1
          $msi = $files | Where-Object { $_.Extension -eq ".msi" } | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName -Destination (Join-Path $publishDir "retail-manager-setup-$version.exe") }
          if ($msi) { Copy-Item $msi.FullName -Destination (Join-Path $publishDir "retail-manager-installer-$version.msi") }

          Push-Location $publishDir
          git init -q
          git config user.email "ci@retail-manager.local"
          git config user.name "retail-manager CI"
          git checkout -q -b $branch
          git add -A
          git commit -q -m "Automated build from stadium93/retail-manager @ ${{ github.sha }} (run ${{ github.run_number }})"
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/stadium94/app-releases.git"
          git push --force origin "HEAD:$branch"
          Pop-Location



