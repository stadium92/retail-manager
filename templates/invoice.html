<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invoice - {{invoiceNumber}}</title>
  <style>
    @page { size: A4; margin: 24mm; }
    body{ font-family: Inter, Arial, sans-serif; color:#111; font-size:12px; margin:0; }
    .header{ display:flex; justify-content:space-between; align-items:center; }
    .company{ text-align:left; }
    .company h1{ margin:0; }
    .meta{ text-align:right; }
    .lines{ margin-top:20px; }
    table{ width:100%; border-collapse:collapse; }
    th, td{ padding:8px; border-bottom:1px solid #eee; }
    th{ background:#f7f7f7; text-align:left; }
    .text-right{ text-align:right; }
    .totals{ margin-top:16px; float:right; width:320px; }
    .notes{ margin-top:32px; font-size:11px; color:#444; }
  </style>
</head>
<body>
  <div class="header">
    <div class="company">
      <h1>{{storeName}}</h1>
      <div>{{storeAddress}}</div>
      <div>{{storePhone}}</div>
    </div>
    <div class="meta">
      <div>Invoice: <strong>{{invoiceNumber}}</strong></div>
      <div>Date: {{date}}</div>
      <div>Cashier: {{cashier}}</div>
    </div>
  </div>

  <div class="lines">
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>SKU</th>
          <th class="text-right">Qty</th>
          <th class="text-right">Unit</th>
          <th class="text-right">Total</th>
        </tr>
      </thead>
      <tbody>
        {{#items}}
        <tr>
          <td>{{name}}</td>
          <td>{{sku}}</td>
          <td class="text-right">{{quantity}}</td>
          <td class="text-right">{{unitPrice}}</td>
          <td class="text-right">{{lineTotal}}</td>
        </tr>
        {{/items}}
      </tbody>
    </table>

    <div class="totals">
      <table>
        <tr>
          <td>Subtotal</td>
          <td class="text-right">{{subtotal}}</td>
        </tr>
        <tr>
          <td>Tax</td>
          <td class="text-right">{{tax}}</td>
        </tr>
        <tr style="font-weight:700">
          <td>Total</td>
          <td class="text-right">{{total}}</td>
        </tr>
      </table>
    </div>
  </div>

  <div class="notes">
    <div>Notes:</div>
    <div>{{notes}}</div>
  </div>
</body>
</html>
