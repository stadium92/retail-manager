version: "2"
type: frontend
tech_stack:
  - TypeScript
  - React 18
  - Vite
  - Tailwind CSS
  - Radix UI
  - Supabase (auth + database)
  - i18next (internationalization)
  - React Query (TanStack)
  - IndexedDB via LocalDatabase (offline-first)
routes:
  - path: /
    file: src/pages/Index.tsx
    auth_required: false
    description: Public landing page / customer catalog
  - path: /auth
    file: src/pages/Auth.tsx
    auth_required: false
    description: Login and bootstrap page for all roles
  - path: /customer/browse
    file: src/pages/customer/Browse.tsx
    auth_required: false
    description: Public product browsing page for customers
  - path: /worker/dashboard
    file: src/pages/worker/WorkerDashboard.tsx
    auth_required: true
    description: Main workspace for cashier, cook, and waiter roles
  - path: /master/dashboard
    file: src/pages/master/Dashboard.tsx
    auth_required: true
    description: Owner/master dashboard with full management access
  - path: /deliverer/dashboard
    file: src/pages/deliverer/DelivererDashboard.tsx
    auth_required: true
    description: Delivery staff dashboard
features:
  - name: User Login (Cloud Bootstrap)
    description: First-time cloud login that syncs Supabase account to local IndexedDB session
    files:
      - src/pages/Auth.tsx
      - src/contexts/AuthContext.tsx
      - src/services/OfflineAuthService.ts
    entry_route: /auth
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Click "Se connecter" / Login button
      - See loading spinner during cloud authentication
      - Redirect to role-based dashboard on success
      - See error toast on invalid credentials
    api_calls:
      - method: POST
        endpoint: https://kvxqutffphaxlhjyyjsw.supabase.co/auth/v1/token
    auth_required: false

  - name: Role-Based Access Control
    description: Routes and UI modules filtered by role (master, cashier, cook, waiter, worker, deliverer, customer)
    files:
      - src/utils/accessControl.ts
      - src/contexts/AuthContext.tsx
      - src/components/worker/Layout/WorkerLayout.tsx
      - src/components/worker/Layout/WorkerMenuBar.tsx
    entry_route: /worker/dashboard
    user_interactions:
      - Cashier sees only Commandes and Programme menu sections
      - Cook sees only Restaurant (KDS) and Programme menu sections
      - Waiter sees only Plan de salle / Tables
      - Unauthorized module access is blocked and redirected
    api_calls:
      - method: GET
        endpoint: https://kvxqutffphaxlhjyyjsw.supabase.co/rest/v1/user_roles
    auth_required: true

  - name: Cashier POS (Point of Sale)
    description: Sales ticket creation, billing, and cash closing for cashier role
    files:
      - src/components/worker/Modules/SalesModule.tsx
      - src/components/worker/Modules/FicheCaisseModule.tsx
      - src/components/worker/Modules/ReglementsBonsModule.tsx
      - src/components/mobile/Sales/MobileSalesModule.tsx
      - src/components/mobile/Sales/MobileFicheCaisse.tsx
    entry_route: /worker/dashboard
    user_interactions:
      - Select products to add to ticket
      - Apply quantity and pricing
      - Confirm and print sale ticket
      - Close cash register (Fermeture Caisse)
      - Manage settlement of invoices (Règlement de bons)
    api_calls:
      - method: POST
        endpoint: /api/sales
    auth_required: true

  - name: Kitchen Display System (KDS)
    description: Real-time order display and management for cook role
    files:
      - src/components/worker/Modules/KitchenDisplay.tsx
      - src/components/mobile/KDS/MobileKDS.tsx
    entry_route: /worker/dashboard
    user_interactions:
      - View incoming orders in real-time
      - Mark orders as in-progress or completed
      - Filter orders by status
    api_calls:
      - method: GET
        endpoint: https://kvxqutffphaxlhjyyjsw.supabase.co/rest/v1/orders
    auth_required: true

  - name: Table Management (Plan de salle)
    description: Restaurant floor plan and table management for waiter role
    files:
      - src/components/worker/Modules/TableManagement.tsx
    entry_route: /worker/dashboard
    user_interactions:
      - View restaurant floor plan
      - Select and manage table status
      - Assign orders to tables
    api_calls:
      - method: GET
        endpoint: https://kvxqutffphaxlhjyyjsw.supabase.co/rest/v1/tables
    auth_required: true

  - name: Master Dashboard
    description: Full management interface for restaurant owners including sales, stock, team, and reports
    files:
      - src/pages/master/Dashboard.tsx
      - src/pages/master/Sales.tsx
      - src/pages/master/Team.tsx
      - src/components/master/Dashboard/DashboardView.tsx
    entry_route: /master/dashboard
    user_interactions:
      - View revenue and sales charts
      - Manage team members and roles
      - Access full reporting and edition modules
      - Manage stock and inventory
    api_calls:
      - method: GET
        endpoint: https://kvxqutffphaxlhjyyjsw.supabase.co/rest/v1/restaurants
    auth_required: true

  - name: Programme / Settings
    description: Application settings including preferences, key programming, and password management
    files:
      - src/components/worker/Modules/SettingsModule.tsx
    entry_route: /worker/dashboard
    user_interactions:
      - Access preferences settings
      - Configure key programming shortcuts
      - Manage and change passwords
    api_calls: []
    auth_required: true

  - name: Offline Authentication Fallback
    description: When cloud is unavailable, authentication falls back to locally cached IndexedDB session
    files:
      - src/services/OfflineAuthService.ts
      - src/services/LocalDatabase.ts
    entry_route: /auth
    user_interactions:
      - Login with email and password while offline
      - System resolves role and store from local cache
      - Access worker dashboard in offline mode
    api_calls: []
    auth_required: false

  - name: Mobile Worker Layout
    description: Mobile-optimized layout with bottom tab bar for cashier, cook, and waiter on phones
    files:
      - src/components/mobile/MobileWorkerLayout.tsx
      - src/components/mobile/MobileMenuScreen.tsx
      - src/components/mobile/POS/MobilePOS.tsx
    entry_route: /worker/dashboard
    user_interactions:
      - Navigate via bottom tab bar (Caisse, Cuisine, Menu)
      - Cook sees KDS-only single screen
      - Cashier sees POS and Menu tabs
      - Waiter sees Menu tab with Tables option
    api_calls: []
    auth_required: true

known_limitations:
  - issue: Waiter role has no direct mobile module - taps Menu tab then selects Tables
    location: src/components/mobile/MobileWorkerLayout.tsx
    impact: Extra navigation step for waiters on mobile
  - issue: Programme settings (Preferences, Key Programming) open in desktop overlay on mobile
    location: src/components/mobile/MobileWorkerLayout.tsx
    impact: Settings UX on mobile is a desktop-style modal overlay
